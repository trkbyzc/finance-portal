# Finance Portal Frontend — Nginx config (SPA + API proxy)
#
# - Static dosyalar /usr/share/nginx/html'den serve edilir.
# - React Router için try_files fallback (deep link → index.html).
# - /api/ istekleri docker-compose'daki `app-backend` servisine proxy edilir.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip — statik asset'ler için bant genişliği tasarrufu
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # SPA fallback — tüm bilinmeyen path'leri index.html'e yönlendir (React Router yakalar)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Haber servisi ---
    # /api/v1/news/... ayri bir uygulamaya gider (finance-portal-news:8082).
    #
    # nginx en UZUN eslesen onek kazanir kuralini uygular, bu yuzden bu blok
    # asagidaki /api/ blogundan once gelmesine gerek olmadan da onceliklidir —
    # yine de okuyan icin ustte duruyor.
    #
    # Yol OLDUGU GIBI iletilir (proxy_pass sonunda "/" YOK): haber servisinin
    # context-path'i de /api/v1 oldugu icin yeniden yazmaya gerek yok. Sonuna "/"
    # koymak yolu keser ve haber servisi istegi 404 dondururdu.
    location /api/v1/news/ {
        proxy_pass http://app-news:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Uzantisiz hali: /api/v1/news (liste ucu) — yukaridaki onek buna UYMAZ,
    # cunku sondaki "/" eksik. Ayri bir tam-eslesme kurali gerekiyor.
    location = /api/v1/news {
        proxy_pass http://app-news:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # API proxy — frontend container'dan backend container'a (docker network içi DNS)
    location /api/ {
        proxy_pass http://app-backend:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # OAuth2 / Bearer token header'ları geçsin
        proxy_pass_request_headers on;
        # Long polling / SSE için timeout artır
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Keycloak artık kendi LoadBalancer IP'sinde — frontend'den proxy YOK.
    # Browser doğrudan http://<keycloak-lb-ip>/realms/finance-realm/... bağlanır.

    # Cache-Control: HTML cache'lenmesin (immutable hashed asset'ler hariç)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|eot|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
