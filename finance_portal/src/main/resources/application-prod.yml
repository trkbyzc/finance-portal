# =====================================================================
# PROD profile — canlı/üretim için güvenlik + performans sertleştirmesi
# =====================================================================
# Aktive: SPRING_PROFILES_ACTIVE=prod
# Tüm secret'lar env variable'dan gelmeli (.env veya k8s Secret).
# application-local.yml prod'da YÜKLENMEMELİDİR (dev-only).

spring:
  jpa:
    # SQL log basma — performans + güvenlik (query plan PII içerebilir)
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        generate_statistics: false

  # DataSource HikariCP — prod için daha agresif connection pool
  datasource:
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1800000
      leak-detection-threshold: 60000

# Actuator — dışarıya yalnızca sağlık kontrolü için gerekli olan kadarı.
# Konteyner healthcheck'i /actuator/health kullanıyor, o yüzden o açık kalmalı.
# Geri kalan her şey kapalı (S5852 — saldırı yüzeyini küçültür).
management:
  endpoints:
    web:
      exposure:
        # prometheus BİLEREK ÇIKARILDI. Canlı dağıtımda Prometheus çalışmıyor
        # (gözlemlenebilirlik yığını kaynak yetersizliğinden alınmadı), dolayısıyla bu uç
        # kimseye veri sağlamıyordu — yalnızca dışarıya 4.700 satır iç bilgi veriyordu:
        # disk kapasitesi, thread havuzları, sınıf adları, tüm uç adresleri ve veritabanı
        # havuz istatistikleri. Saldırgan için hazır keşif verisi.
        # Prometheus canlıya alınırsa geri eklenmeli AMA erişimi kısıtlanarak.
        include: "health,info"
        exclude: "env,beans,configprops,heapdump,threaddump,mappings,loggers,prometheus,metrics"
  endpoint:
    health:
      # PII sızdırmasın — sadece authenticated kullanıcı detay görsün
      show-details: never
      show-components: never
    info:
      enabled: true
  info:
    git:
      mode: simple   # commit hash + branch (debug için), full diff yok

# Server hardening — error response'ta stack trace verme
server:
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false
  # Server header'ı gizle — fingerprinting'i zorlaştırır
  servlet:
    session:
      cookie:
        http-only: true
        secure: true
        same-site: strict

logging:
  # Kafka appender'sız yapılandırma — canlıda log işleme hattı çalışmıyor,
  # broker aranmasın diye ayrı dosya kullanılır.
  config: classpath:log4j2-prod.xml
  level:
    root: WARN
    com.financeportal: INFO
    org.springframework: WARN
    org.springframework.security: WARN
    # Hibernate WARN'a → query log basmasın, ama veri bütünlüğü uyarıları kalsın
    org.hibernate: WARN
  # Not: desen log4j2-prod.xml içinde tanımlı. Spring'in logging.pattern.* ayarları
  # açık bir Log4j2 yapılandırması verildiğinde dikkate alınmaz, o yüzden burada yok.

# Kafka — canlıda broker çalışmıyor (kaynak yetersiz). Kapatılmazsa kullanıcı
# kaydındaki olay gönderimi meta veri beklerken thread'i 60 sn bloklar.
app:
  kafka:
    enabled: false

  # Demo portföyü — SADECE canlıda. Veritabanı sıfırdan kurulduğu ve Flyway yalnızca
  # şema ürettiği için demo hesabı boş bir portföyle açılıyordu. Tohumlayıcı idempotent:
  # kullanıcının hiç pozisyonu yoksa yazar, aksi halde hiçbir şey yapmaz.
  # Ayrıntılar: com.financeportal.demo.DemoPortfolioSeeder
  demo:
    seed-portfolio: true
    seed-username: demouser

# =====================================================================
# Veri kaynağı politikası — CANLI ORTAM
# =====================================================================
# Buradaki kısıtlamalar YALNIZCA prod profilinde geçerlidir. Yerel çalıştırmada
# (dev/local) hiçbir kaynak kapalı değildir; uygulama tam işlevsel gelir.
#
# Ayrım şu: bir kaynağı kendi makinende kullanmak ile onu anonim ziyaretçilere
# SUNMAK aynı şey değildir. İkincisi yeniden dağıtımdır ve resmî olmayan uçların
# ya da kazınan sitelerin kullanım şartları buna izin vermez.
#
# Kapalı kaynak istendiğinde 503 + DATA_SOURCE_UNAVAILABLE dönülür; arayüz bunu
# hata olarak değil, gerekçesini açıklayan bir bilgi kartı olarak gösterir.
data-sources:
  policies:

    # --- Resmî olmayan uçlar: canlıda kapalı ---
    yahoo:
      enabled: false
      demo-data: true
      note: >-
        Küresel hisse, endeks, emtia ve ETF verisi Yahoo Finance'in belgelenmemiş
        ucundan gelir; şartları üçüncü taraflara yeniden sunuma izin vermediği için
        canlı demoda kapalıdır. Yerel kurulumda tam çalışır.

    tradingview-logo:
      enabled: false
      note: >-
        Sembol logoları TradingView'in marka varlıklarıdır; canlı demoda
        sunulmaz, yerine sembolün baş harfleri gösterilir.

    businessinsider:
      enabled: false
      note: >-
        Küresel tahvil kotasyonları resmî olmayan bir uçtan alınır;
        canlı demoda kapalıdır.

    hesapkurdu:
      enabled: false
      note: >-
        Mevduat/kredi oranları üçüncü tarafın dahili API'sinden gelir;
        canlı demoda kapalıdır.

    # --- Kazıma (scraping): canlıda kapalı ---
    fintables:
      enabled: false
      demo-data: true
      note: >-
        BİST hisseleri ve TEFAS fonları Fintables'tan alınır. Fintables ücretli
        bir abonelik ürünüdür; verisini canlı bir demoda yeniden sunmak doğru
        olmaz. Yerel kurulumda bu bölümler tam çalışır.

    isyatirim:
      enabled: false
      demo-data: true
      note: >-
        Temel veriler, BİST endeksi ve VİOP kontratları İş Yatırım sayfalarından
        kazınarak elde edilir; canlı demoda kapalıdır.

    ipo-scraper:
      enabled: false
      note: >-
        Halka arz takvimi üçüncü taraf bir siteden kazınır;
        canlı demoda kapalıdır.

    news-content:
      enabled: false
      note: >-
        Haber başlıkları RSS ile gelir ve kaynağına yönlendirir. Makalenin tam
        metnini uygulama içinde göstermek telifli içeriğin yeniden yayını olacağı
        için canlı demoda kapalıdır.

    investing-calendar:
      enabled: false
      note: >-
        Ekonomik takvim TradingView'in belgelenmemiş feed'inden alınır; şartları
        üçüncü taraflara yeniden sunuma izin vermediği için canlı demoda kapalıdır.
        Yerel kurulumda tam çalışır.

    # --- Resmî API'ler ve RSS: canlıda açık (base profildeki değerler geçerli) ---
    # evds · fred · binance · coingecko · finnhub · truncgil · feargreed · news-rss
