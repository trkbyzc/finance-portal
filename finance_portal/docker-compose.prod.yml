# =====================================================================
# CANLI DAĞITIM — Oracle Cloud (Ampere A1 / arm64, 2 OCPU · 12 GB)
# =====================================================================
# Yerel geliştirmedeki docker-compose.yml 19 servis çalıştırır. Burada yalnızca
# kullanıcının ekranda gördüğü şeyin çalışması için gerekenler var:
#
#   caddy · app-frontend · app-backend · keycloak · postgres · redis · lingva
#
# Canlıya ALINMAYANLAR ve nedenleri:
#   kafka + zookeeper + logstash + opensearch(+dashboards)  → log işleme hattı;
#       tek başına birkaç GB ister, demo için gereksiz (log'lar stdout'a gider)
#   prometheus + grafana + tempo + otel-collector           → gözlemlenebilirlik yığını
#   sonarqube (~2 GB) · pgadmin · openldap · phpldapadmin   → geliştirme araçları
#
# Kullanım:
#   cp .env.prod.example .env.prod   &&   nano .env.prod     # sırları doldur
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# NOT: İmajlar sunucuda derlenir (arm64). Windows'ta derlenmiş amd64 imajlar çalışmaz.
# =====================================================================

services:

  # --- Tek dışa açık servis: TLS sonlandırma + yönlendirme ---
  caddy:
    image: caddy:2
    container_name: finance-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # Let's Encrypt sertifikaları — SİLME, rate limit'e takılırsın
      - caddy_config:/config
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?APP_DOMAIN gerekli (or. finance.turkbey.dev)}
      AUTH_DOMAIN: ${AUTH_DOMAIN:?AUTH_DOMAIN gerekli (or. auth.turkbey.dev)}
      ROOT_DOMAIN: ${ROOT_DOMAIN:?ROOT_DOMAIN gerekli (kok alan adi; uygulamaya yonlendirilir)}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL gerekli (sertifika bildirimleri icin)}
    depends_on:
      - app-frontend
      - keycloak

  # --- Veri katmanı: dışarı KAPALI, sadece iç ağdan erişilir ---
  postgres:
    image: postgres:15
    container_name: finance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-finance_db}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME gerekli}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD gerekli}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-finance_user} -d ${DB_NAME:-finance_db}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: finance-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data

  # --- Kimlik sağlayıcı: auth.<alan-adı> üzerinden Caddy proxy'ler ---
  keycloak:
    # Yerel compose hazir imaji kullanip tema/SPI/realm'i host'tan mount eder.
    # Canlida bu yapilamaz: ban-authenticator'in JAR'i target/ altinda uretilir ve
    # git'e girmez — sunucuda o dosya yoktur. Ayrintili gerekce keycloak.Dockerfile'da.
    build:
      context: .
      dockerfile: keycloak.Dockerfile
    image: finance-portal-keycloak:prod
    container_name: finance-keycloak
    restart: unless-stopped
    command: start --import-realm
    # Normalde Keycloak ~500 MB ile calisir. Bu sinir, acilista bir yeniden derleme
    # tetiklenirse onun hayatta kalmasi icin: augmentation JVM'i konteyner sinirinin
    # %70'ini heap yapar ve 1500m ile OLDURULUYORDU (asagidaki nota bak).
    mem_limit: 2500m
    environment:
      # DIKKAT — KC_DB ve KC_HEALTH_ENABLED build zamani secenekleri OLMASINA RAGMEN
      # burada TEKRARLANMAK ZORUNDA. Keycloak acilista runtime yapilandirmasini imaja
      # gomulu olanla karsilastirir; bir secenek runtime'da YOKSA "varsayilanina donmus"
      # sayar ve degisiklik gordugu icin imaji yeniden derlemeye kalkar:
      #     - db=postgres > db=dev-file
      #     - health-enabled=true > health-enabled=false
      # Yeniden derleme once lib/quarkus'u siler, sonra yeniden uretir. Bellek yetmeyip
      # yarida olurse dizin silinmis kalir ve konteyner
      # "NoSuchFileException: quarkus-application.dat" ile sonsuz doner.
      # Yani bu iki satiri silmek Keycloak'i tamamen calismaz hale getirir.
      KC_DB: postgres
      KC_HEALTH_ENABLED: "true"
      KC_DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-finance_db}
      KC_DB_USERNAME: ${DB_USERNAME:?DB_USERNAME gerekli}
      KC_DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD gerekli}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?KEYCLOAK_ADMIN gerekli}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD gerekli}
      # TLS'i Caddy sonlandırır; Keycloak HTTP dinler ama X-Forwarded-* başlıklarına güvenir.
      KC_HOSTNAME: ${AUTH_DOMAIN:?AUTH_DOMAIN gerekli}
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      # Yerel compose'daki tema cache kapatma ayarları BİLİNÇLİ olarak yok — onlar dev içindi.
    depends_on:
      postgres:
        condition: service_healthy

  # --- Haber çevirisi (self-hosted, dış API anahtarı gerekmez) ---
  # Yayinlanan imaj SADECE linux/amd64 — bu sunucu arm64, calistirilamiyor
  # ("exec format" / surekli restart). Yayinci arm64 basmadigi icin kaynaktan
  # deriyoruz; Next.js uygulamasi ve tabani node:lts-alpine, ARM'de sorunsuz derlenir.
  #
  # Depoda surum etiketi yok ve main Ocak 2023'ten beri durgun → tekrarlanabilirlik
  # icin commit'e sabitlendi.
  #
  # NOT: Yukaridaki deponun Dockerfile'i Next.js derlemesini imaj derlenirken degil
  # KONTEYNER BASLARKEN yapiyor (CMD icinde `yarn build && yarn start`). Bu yuzden
  # ilk acilis birkac dakika surer; o sirada ceviri calismaz, haberler cevrilmemis
  # gorunur. Uygulama bunu zaten tolere ediyor (TranslationClient basarisizlikta
  # null doner, NewsSyncService 3 dk bekleyip RSS-only sync'e duser).
  lingva:
    build:
      context: https://github.com/thedaviddelta/lingva-translate.git#0190ea5da9fbccba51e82184ca855c4ef5728fc7
    image: finance-portal-lingva:prod
    container_name: finance-lingva
    restart: unless-stopped

  # --- Uygulama ---
  app-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: finance-portal-backend:prod
    container_name: finance-app-backend
    restart: unless-stopped
    dns: ["1.1.1.1", "8.8.8.8"]
    # Sunucuda 12 GB var ama postgres + keycloak + nginx de pay istiyor. Sinir koymazsak
    # JVM ana makinenin tamamini gorur ve MaxRAMPercentage=75 ~9 GB heap acar.
    mem_limit: 3g
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8081"

      # Dockerfile'daki varsayilan JAVA_OPTS'u EZIYORUZ: icinde
      # `-javaagent:/app/otel-agent.jar` var ve canlida OTel collector calismiyor.
      # Agent'i birakirsak her export denemesinde baglanti hatasi basar.
      # allowRestrictedHeaders KALIYOR: JDK "Origin" basligini dusuruyor, bazi
      # kaynaklar onsuz 403 veriyor.
      JAVA_OPTS: "-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Dsun.net.http.allowRestrictedHeaders=true"

      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-finance_db}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME gerekli}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD gerekli}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      LINGVA_URL: http://lingva:3000

      # Token'ın iss claim'i tarayıcının gördüğü adresle aynı olmalı;
      # JWK ise iç ağdan çekilir (Caddy'ye çıkmaya gerek yok).
      KEYCLOAK_SERVER_URL: https://${AUTH_DOMAIN}
      KEYCLOAK_ISSUER_URI: https://${AUTH_DOMAIN}/realms/${KEYCLOAK_REALM:-finance-realm}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:-finance-realm}/protocol/openid-connect/certs
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-finance-realm}
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}

      # "*" KULLANMA — allowCredentials ile birleşince CSRF açar (SecurityConfig notu).
      SECURITY_CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN}

      # Resmî API anahtarları (boş bırakılabilir; ilgili modül devre dışı kalır).
      EVDS_API_KEY: ${EVDS_API_KEY:-}
      FRED_API_KEY: ${FRED_API_KEY:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      FMP_API_KEY: ${FMP_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}

      # E-posta (fiyat alarmları). Kapalıysa alarmlar kaydedilir ama posta gitmez.
      APP_MAIL_ENABLED: ${APP_MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-noreply@${APP_DOMAIN}}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  app-frontend:
    build:
      context: ../finance-frontend
      dockerfile: Dockerfile
      args:
        # Tarayıcı API'ye göreli yoldan gider; nginx /api/ → app-backend:8081 proxy'ler.
        VITE_API_BASE_URL: /api/v1
        VITE_KEYCLOAK_URL: https://${AUTH_DOMAIN}
        VITE_KEYCLOAK_REALM: ${KEYCLOAK_REALM:-finance-realm}
        VITE_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-finance-client}
        VITE_APP_URL: https://${APP_DOMAIN}
    image: finance-portal-frontend:prod
    container_name: finance-app-frontend
    restart: unless-stopped
    depends_on:
      - app-backend

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
